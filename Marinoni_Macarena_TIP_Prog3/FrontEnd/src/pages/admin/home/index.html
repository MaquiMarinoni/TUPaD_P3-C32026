<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Food Store - Admin</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<div id="admin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2 id="modal-title">Acción</h2>
        <form id="admin-form">
            <div id="modal-fields"></div>
            <div class="modal-actions">
                <button type="button" id="close-modal" class="btn-cancel">Cancelar</button>
                <button type="submit" class="btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>

<body class="admin-page">

    <aside class="sidebar">
        <div class="logo">Food<strong>Store</strong></div>
        <nav>
            <button class="nav-btn active" data-view="dashboard"><i class="fas fa-chart-line"></i> Dashboard</button>
            <button class="nav-btn" data-view="productos"><i class="fas fa-box"></i> Productos</button>
            <button class="nav-btn" data-view="categorias"><i class="fas fa-tags"></i> Categorías</button>
            <button class="nav-btn" data-view="pedidos"><i class="fas fa-shopping-cart"></i> Pedidos</button>
            <hr>
            <a href="/src/pages/store/home/index.html" class="nav-btn"><i class="fas fa-store"></i> Ver Tienda</a>
        </nav>
    </aside>

    <main class="content">
        <header class="admin-header">
            <h1 id="view-title">Bienvenido, Admin</h1>
            <button id="btn-logout" class="btn-logout">Salir</button>
        </header>
        <section id="admin-content"></section>
    </main>

    <div id="admin-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Acción</h2>
            <form id="admin-form">
                <div id="modal-fields"></div>
                <div class="modal-actions">
                    <button type="button" id="close-modal" class="btn-cancel">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./admin.ts"></script>



</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Food Store - Gestión de Pedidos</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <aside class="sidebar">
        <div class="logo">Food<strong>Store</strong></div>
        <nav>
            <a href="/src/pages/admin/adminHome/index.html" class="nav-btn"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="/src/pages/admin/products/index.html" class="nav-btn"><i class="fas fa-box"></i> Productos</a>
            <a href="/src/pages/admin/categories/index.html" class="nav-btn"><i class="fas fa-tags"></i> Categorías</a>
            <a href="/src/pages/admin/orders/index.html" class="nav-btn active"><i class="fas fa-shopping-cart"></i> Pedidos</a>
            <hr>
            <a href="/src/pages/store/home/index.html" class="nav-btn"><i class="fas fa-store"></i> Ver Tienda</a>
        </nav>
    </aside>

    <main class="content">
        <header class="admin-header">
            <h1 id="view-title">Gestión de Pedidos</h1>
            <button id="btn-logout" class="btn-logout">Salir</button>
        </header>
        
        <section style="padding-top: 20px;">
            <div class="view-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <p style="color: #666;">Monitorea y gestiona las ventas de la tienda.</p>
                
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label for="status-filter" style="font-weight: bold; font-size: 14px;">Filtrar:</label>
                    <select id="status-filter" style="padding: 8px 15px; border-radius: 5px; border: 1px solid #ccc;">
                        <option value="ALL">Todos los pedidos</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="EN_PREPARACION">En Preparación</option>
                        <option value="ENVIADO">Enviados</option>
                        <option value="ENTREGADO">Entregados</option>
                    </select>
                </div>
            </div>

            <div id="admin-orders-list" style="display: flex; flex-direction: column; gap: 15px;">
                <p>Cargando pedidos...</p>
            </div>
        </section>
    </main>

    <div id="order-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 id="modal-title" style="margin: 0;">Detalle del Pedido</h2>
                <button id="close-modal-top" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #999;">&times;</button>
            </div>
            <div id="modal-body"></div>
            <div class="modal-actions" style="margin-top: 20px; text-align: right;">
                <button type="button" id="close-modal" class="btn-primary">Cerrar Detalle</button>
            </div>
        </div>
    </div>

    <script type="module" src="./orders.ts"></script>
</body>
</html>

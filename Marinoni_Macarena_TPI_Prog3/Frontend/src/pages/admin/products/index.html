<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Food Store - Gestión de Productos</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="admin-page">
    <aside class="sidebar">
        <div class="logo">Food<strong>Store</strong></div>
        <nav>
            <a href="/src/pages/admin/adminHome/index.html" class="nav-btn"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="/src/pages/admin/products/index.html" class="nav-btn active"><i class="fas fa-box"></i> Productos</a>

        </nav>

    <main class="content">

                <div id="modal-fields"></div>

                    <button type="submit" class="btn-primary">Guardar Cambios</button>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>

<body class="auth-page">
    <div class="auth-container">
        <h2>Crear Cuenta</h2>
        <form id="register-form">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="celular">Celular</label>
                <input type="text" id="celular" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required minlength="6">
                <small style="color: #666; font-size: 12px;">Mínimo 6 caracteres.</small>
            </div>
            <button type="submit" class="btn-primary">Registrarse</button>
        </form>
        <p class="auth-switch">¿Ya tenés cuenta? <a href="../login/index.html">Iniciá sesión</a></p>
    </div>

    <script type="module" src="./register.ts"></script>
</body>

</html>

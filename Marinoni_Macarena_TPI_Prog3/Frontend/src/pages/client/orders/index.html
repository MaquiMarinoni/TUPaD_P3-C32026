<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Food Store - Mis Pedidos</title>
    <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="store-page">

    <header class="main-header">
        <div class="header-container">
            <a href="/src/pages/store/home/index.html" class="logo">Food<strong>Store</strong></a>
            <nav class="main-nav">
                <a href="/src/pages/store/home/index.html" class="nav-link">Catálogo</a>
                <a href="/src/pages/client/orders/index.html" class="nav-link active">Mis Pedidos</a>
                <a href="/src/pages/store/cart/index.html" class="nav-link">Carrito</a>
                <a href="#" class="nav-link" id="link-logout" style="color: #ff4757;">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </nav>
        </div>
    </header>

    <main class="orders-container" style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <h2>🛍️ Mis Pedidos</h2>
        <div id="my-orders-list" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
            <p>Cargando tus pedidos...</p>
        </div>
    </main>

    <div id="order-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 600px;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 id="modal-title" style="margin: 0;">Detalle del Pedido</h2>
                <button id="close-modal-top" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #999;">&times;</button>
            </div>
            
            <div id="modal-body">
                </div>
            
            <div class="modal-actions" style="margin-top: 20px; text-align: right;">
                <button type="button" id="close-modal" class="btn-primary">Cerrar Detalle</button>
            </div>
        </div>
    </div>

    <script type="module" src="./orders.ts"></script>
</body>
</html>

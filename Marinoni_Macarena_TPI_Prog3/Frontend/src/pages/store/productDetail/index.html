<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Detalle del Producto</title>
    <link rel="stylesheet" href="../../../css/styles.css">
    <style>
        /* Contenedor principal de la tarjeta de detalle */
        .detail-card {
            display: flex;
            flex-wrap: wrap;
            background: #fff;
            max-width: 900px;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .detail-img-wrapper {
            flex: 1 1 400px; /* Crece y se encoge, tamaño base 400px */
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .detail-img-wrapper img {
            width: 100%;
            height: 100%;
            max-height: 500px;
            object-fit: cover;
        }
        
        .detail-info {
            flex: 1 1 400px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .badge-cat {
            background: #eee;
            color: #555;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            align-self: flex-start;
            margin-bottom: 15px;
        }
        
        .detail-title {
            font-size: 2.2rem;
            margin: 0 0 15px 0;
            color: #333;
        }
        
        .detail-desc {
            font-size: 1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        
        .detail-price {
            font-size: 2rem;
            font-weight: bold;
            color: var(--orange-primary, #e67e22);
            margin-bottom: 5px;
        }
        
        .detail-stock {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 30px;
        }
        
        .btn-agregar {
            background: var(--orange-primary, #e67e22);
            color: white;
            border: none;
            padding: 15px 0;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        
        .btn-agregar:hover { background: #d35400; }
        .btn-agregar:disabled { background: #ccc; cursor: not-allowed; }
        
        .btn-back {
            display: inline-block;
            margin: 20px 0 0 20px;
            color: #666;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        
        .btn-back:hover { color: var(--orange-primary, #e67e22); }
    </style>
</head>
<body class="store-page">
    <nav>
        <div class="logo">Food<strong>Store</strong></div>
        <div style="display: flex; gap: 15px; align-items: center;">

            <a href="/src/pages/client/orders/index.html" class="nav-btn" id="link-mis-pedidos" style="display: none;">Mis Pedidos</a>
            <a href="/src/pages/store/cart/index.html" class="nav-btn" id="link-carrito">
                Carrito <span id="cart-count" style="background: white; color: var(--orange-primary); padding: 2px 6px; border-radius: 50%; font-size: 12px; font-weight: bold; margin-left: 5px;">0</span>
            </a>
        </div>
    </nav>

    <a href="/src/pages/store/home/index.html" class="btn-back">← Volver al Catálogo</a>

    <main id="detalle-container" style="padding: 20px;">
        <p style="text-align: center; color: #666; margin-top: 50px;">Cargando detalle del producto...</p>
    </main>

    <script type="module" src="./productDetail.ts"></script>
</body>
</html>
